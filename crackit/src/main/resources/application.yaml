spring:
  application:
    name: CrackIt
  config:
    import: "optional:classpath:application-local.yaml"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/job_assistant}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}

  task:
    scheduling:
      pool:
        size: 5

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: crackit-ai-worker-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.crackit.*"

kafka:
  enabled: ${KAFKA_ENABLED:true}

server:
  port: ${SERVER_PORT:5981}
  address: 0.0.0.0

jwt:
  secret: ${JWT_SECRET:crackit-default-jwt-secret-key-replace-in-production-2026}

ai:
  service:
    url: ${AI_SERVICE_URL:https://crackit-ai-rsnu.onrender.com/api/ai}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://172.168.0.142:5173}

adzuna:
  app:
    id: ${ADZUNA_APP_ID:your_adzuna_app_id}
    key: ${ADZUNA_APP_KEY:your_adzuna_app_key}

jsearch:
  api:
    key: ${JSEARCH_API_KEY:your_jsearch_api_key}

geodb:
  api:
    key: ${GEODB_API_KEY:your_geodb_api_key}
    host: ${GEODB_API_HOST:wft-geo-db.p.rapidapi.com}

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:}
    secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:crackit_local_webhook_secret}
  mock-mode: ${RAZORPAY_MOCK_MODE:true}

keepalive:
  enabled: ${KEEPALIVE_ENABLED:true}
  backend-url: ${RENDER_EXTERNAL_URL:https://crackit-backend-4bpr.onrender.com}

